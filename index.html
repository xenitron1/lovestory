<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#100d25"><title>DUO — 55 игр для двоих</title><meta name="description" content="55 игр для двух ноутбуков"><link rel="stylesheet" href="./assets/styles.css"><link rel="stylesheet" href="./assets/extra.css"></head>
<body><div class="sky" aria-hidden="true"><i></i><i></i><i></i></div><main>
<header><button class="logo" data-go="home">DUO<span>●</span></button><div id="net" class="net"><b></b><span>Подключение</span></div></header>
<section id="home" class="view active"><div class="intro"><small>ИГРАЙТЕ ВМЕСТЕ</small><h1>На одной<br><em>волне</em></h1><p>Два ноутбука, одна комната и 55 игр. Открывайте режимы самостоятельно — действия и раунды синхронизируются автоматически.</p><div class="actions"><button id="create" class="main">Создать комнату <span>→</span></button><button id="openJoin" class="ghost">Войти по коду</button></div></div><div class="visual"><div class="ring r1"></div><div class="ring r2"></div><div class="core">♥</div><b>55</b><span>ИГР</span></div></section>
<section id="connect" class="view"><button class="back" data-go="home">← Назад</button><div class="sheet"><div id="createBox" hidden><small>КОД КОМНАТЫ</small><h2>Отправь его девушке</h2><button id="code" class="code">————</button></div><form id="joinBox" hidden><small>ОБЩАЯ КОМНАТА</small><h2>Введи код</h2><input id="codeInput" maxlength="9" autocomplete="one-time-code" autocapitalize="characters" placeholder="ABCD-EFGH"><button class="main">Войти →</button></form><p id="connectText"></p></div></section>
<section id="lobby" class="view"><div class="lobbyTop"><div><small>ВЫ ВМЕСТЕ</small><h2>Выбирай игру</h2></div><button id="roomPill"></button></div><div id="games" class="games"></div></section>
<section id="play" class="view"><div class="playTop"><button class="back" id="leave">← Все игры</button><span id="round"></span></div><div id="stage"></div></section>
</main><div id="toast"></div><script type="module" src="./assets/app.js"></script></body></html>
